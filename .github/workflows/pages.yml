name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # README 자동 커밋용
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # data/shelf.json -> 정적 HTML과 README 생성
      - name: Test static site build
        run: python -m unittest discover -s tests

      - name: Build static site from shelf.json
        run: python build.py

      - name: Commit generated pages if changed
        run: |
          if ! git diff --quiet README.md index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md index.html
            git commit -m "chore: regenerate pages from shelf.json"
            git push
          fi

      - uses: actions/configure-pages@v5

      # 생성된 HTML + 상호작용 JS + 원본 JSON만 배포
      - name: Prepare site
        run: |
          mkdir -p _site/data _site/assets
          cp index.html _site/index.html
          cp assets/shelf.js _site/assets/shelf.js
          cp data/shelf.json _site/data/shelf.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
